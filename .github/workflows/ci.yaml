name: CI_NewDeal_Communication

on:
  push:
    branches: [ "dev" ] # Le pipeline se déclenche quand tu pousses sur dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperation du code
        uses: actions/checkout@v4

      # Étape indispensable pour l'examen : Créer l'image
      - name: 2. Build de l'image Docker
        run: docker build -t intranet-img .

      # Étape de sécurité (Étape 5 de ton projet)
      - name: 3. Scan de securite (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'intranet-img'
          exit-code: '0' # On met 0 pour que le pipeline continue même s'il y a des alertes
          severity: 'CRITICAL,HIGH'

      # Connexion avec tes Secrets que tu viens de créer
      - name: 4. Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Envoi final sur ton compte dockerhub_arame1808
      - name: 5. Push sur Docker Hub
        run: |
          docker tag intranet-img ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal:latest