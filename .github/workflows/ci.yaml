name: CI_NewDeal_Communication

on:
  push:
    branches: [ "dev" ] # Le pipeline se déclenche quand tu pousses sur dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Recuperation du code
        uses: actions/checkout@v4

      # Étape indispensable pour l'examen : Créer l'image
      - name: 2. Build de l'image Docker
        run: docker build -t intranet-img .

      # Étape de sécurité (Étape 5 de ton projet)
      - name: 3. Scan de securite (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'intranet-img'
          exit-code: '0' 
          severity: 'CRITICAL,HIGH'

      # Connexion : Pseudo en dur pour eviter l'erreur "Username required"
      - name: 4. Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: arame1808
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Envoi final sur ton compte Docker Hub
      - name: 5. Push sur Docker Hub
        run: |
          docker tag intranet-img arame1808/intranet-newdeal:latest
          docker push arame1808/intranet-newdeal:latest 

          